%YAML:1.0
# PANOPTES rig geometry. (OpenCV FileStorage needs the directive line above.)
#
# !! UNMEASURED SINCE THE 2026-11-14 REMOUNT !!
# All ten cameras were remounted after arm-driven intrinsics. Only the
# name -> serial mapping below is current (Rushav, 2026-11-14; top view in
# docs/panoptes_camera_layout.svg). Nothing has been re-measured:
#   - every camera position,
#   - the volume (known to be BIGGER than the 61 x 134 x 119 in below),
#   - the aim point,
#   - the perch
# are STALE ESTIMATES from the pre-remount rig, kept only so the synthetic
# code (python/rig.py, triangulate.py self-test) has numbers to run on. Do
# not quote any of them as measured. Real positions and volume size will come
# from extrinsic calibration (not built; FINDINGS -> Open items).
#
# `measured: 0` below is what code reads. rig.load_layout() warns on it and
# accuracy_study.py refuses to run without --allow-unmeasured. Set it to 1
# only when every number in this file has been re-measured.
#
# LENGTHS IN THIS FILE ARE INCHES. Code converts to millimetres once, in
# rig.load_layout(), and works in mm everywhere after.
#
# Frame (unchanged): origin = near-left-bottom corner of the volume.
#   x right, y away from the operator, z up.

units: inch

measured: 0               # 0 = stale pre-remount estimates, 1 = re-measured
mapping_date: "2026-11-14"   # name -> serial mapping is current as of this date

# STALE: pre-remount volume. The real volume is bigger; size not measured.
volume:
  min: [0, 0, 0]
  max: [61, 134, 119]

# STALE and known wrong: pre-remount aim. Every camera now aims at a point on
# the line between F and G (x roughly mid-width); its y and height have not
# been measured, so the old value is left untouched rather than guessed at.
aim: [30, 67, 30]
up: [0, 0, 1]             # world up, fixes camera roll in the look-at

# STALE: pre-remount perch (y = 102 was the old far side-camera plane).
perch: [30, 102, 50]

# name / serial: CURRENT (2026-11-14).
# position: STALE. Each slot carries the pre-remount tape estimate for the
# same physical place (corner or side, near or far, low or top), not the old
# numbers of the same letter: E and F exchanged places, so they exchanged
# stale positions. The side cameras are not evenly spaced (F, G nearer the far
# end; E, H nearer the near end); the real offsets are unmeasured.
cameras:
  - { name: A, serial: 33659, position: [0,  0,   51.5] }   # near-left corner, low
  - { name: B, serial: 33663, position: [0,  134, 51.5] }   # far-left corner, low
  - { name: C, serial: 33661, position: [61, 134, 51.5] }   # far-right corner, low
  - { name: D, serial: 33665, position: [61, 0,   51.5] }   # near-right corner, low
  - { name: E, serial: 33662, position: [0,  40,  119] }    # left side, near, top
  - { name: F, serial: 33276, position: [0,  102, 119] }    # left side, far, top
  - { name: G, serial: 33275, position: [61, 102, 119] }    # right side, far, top
  - { name: H, serial: 33664, position: [61, 40,  119] }    # right side, near, top
  - { name: I, serial: 33277, position: [30, 0,   119] }    # near end centre, top
  - { name: J, serial: 33660, position: [30, 134, 119] }    # far end centre, top

# One model for all ten: intrinsics measured on 33661 (fit_intrinsics.py).
# Brown-Conrady 5-parameter, chosen over rational after held-out testing.
camera_model:
  model: OptiTrack Prime 13W
  resolution: [1280, 1024]
  fov_deg: [82, 70]       # nominal, horizontal x vertical; a cross-check only
  intrinsics_source: camera 33661
  fx: 782.0
  fy: 781.6
  cx: 644.6
  cy: 511.1
  # [k1, k2, p1, p2, k3], OpenCV order. ASSUMED, not measured: mild barrel
  # chosen so the pinhole+distortion FOV comes out near the 82 x 70 deg spec.
  dist: [-0.08, 0.02, 0.0005, -0.0003, -0.003]
