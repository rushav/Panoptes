  y: { dx_px: -8.6667, dy_px: 576.0000, droll_deg: 0.5444, dsquare_px: -4.9778 }
  z: { dx_px: -17.5556, dy_px: 141.4444, droll_deg: 0.4333, dsquare_px: 29.7111 }
# Measured change for the actual probe size.
raw_effects:
  theta_x: { dx_px: 0.1900, dy_px: -26.6767, droll_deg: -0.0357, dsquare_px: -0.0660 }
  theta_y: { dx_px: 20.6567, dy_px: 0.4933, droll_deg: 0.2983, dsquare_px: 0.0690 }
  theta_z: { dx_px: 1.2500, dy_px: 0.7800, droll_deg: -2.0623, dsquare_px: -0.0293 }
