%YAML:1.0
---
# Written by python/arm_capture.py probe (RUNBOOK §13). Rerun the probe
# rather than editing: it is valid only for this camera, this camera
# position, this grip of the board, and the arm pose it started from.
#
# Tool frame. Rotations are about the tool axes through the TCP, angles in
# deg; translations along the tool axes, in m. Kortex Euler angles are
# x-y-z extrinsic: R = Rz(theta_z) Ry(theta_y) Rx(theta_x) (Gen3 user guide).
# Image: x right, y down, px; roll positive = clockwise on screen; square_px
# = apparent size of one board square, larger = closer.
created_utc: "2026-11-09T23:03:05Z"
camera_serial: 33275
start_pose: [ 0.60791, 0.05604, 0.47326, 90.75426, -3.09902, 87.11667 ]   # x y z m, theta_x/y/z deg
probe_angle_deg: 2.0
probe_step_m: 0.03
start_board: { centroid_px: [ 555.02, 450.26 ], square_px: 43.691, roll_deg: -0.248 }

# Image change per unit tool motion: rotation rows per deg, translation rows per m.
sensitivity:
  theta_x: { dx_px: 0.1767, dy_px: -13.0150, droll_deg: -0.0242, dsquare_px: -0.0075 }
  theta_y: { dx_px: 11.1633, dy_px: -0.0250, droll_deg: 0.1633, dsquare_px: -0.0783 }
  theta_z: { dx_px: -1.1517, dy_px: 1.3283, droll_deg: -1.0505, dsquare_px: -0.0005 }
  x: { dx_px: 798.6667, dy_px: 7.2222, droll_deg: 3.0111, dsquare_px: 0.1333 }
  y: { dx_px: 58.8889, dy_px: 703.2222, droll_deg: 7.9778, dsquare_px: -15.5333 }
  z: { dx_px: -281.5556, dy_px: 125.0000, droll_deg: 1.8444, dsquare_px: 41.3333 }
# Measured change for the actual probe size.
raw_effects:
  theta_x: { dx_px: 0.3533, dy_px: -26.0300, droll_deg: -0.0483, dsquare_px: -0.0150 }
  theta_y: { dx_px: 22.3267, dy_px: -0.0500, droll_deg: 0.3267, dsquare_px: -0.1567 }
  theta_z: { dx_px: -2.3033, dy_px: 2.6567, droll_deg: -2.1010, dsquare_px: -0.0010 }
  x: { dx_px: 23.9600, dy_px: 0.2167, droll_deg: 0.0903, dsquare_px: 0.0040 }
  y: { dx_px: 1.7667, dy_px: 21.0967, droll_deg: 0.2393, dsquare_px: -0.4660 }
  z: { dx_px: -8.4467, dy_px: 3.7500, droll_deg: 0.0553, dsquare_px: 1.2400 }
# Centroid distance between before and after each return to the start, px.
return_error_px: { theta_x: 0.182, theta_y: 0.027, theta_z: 0.113, x: 0.069, y: 0.027, z: 0.166 }

# Which tool axis to use for each image direction. sign: the tool motion's
# sign that moves the board right / down / clockwise / closer; the opposite
# direction is the opposite sign. second_best_ratio: the next strongest axis
# as a fraction of this one (over 0.5: the axes are coupled).
mapping:
  right:
    rotation: { axis: "theta_y", sign: 1, px_per_deg: 11.1633, second_best_ratio: 0.103 }
    translation: { axis: "x", sign: 1, px_per_m: 798.6667, second_best_ratio: 0.353 }
  down:
    rotation: { axis: "theta_x", sign: -1, px_per_deg: 13.0150, second_best_ratio: 0.102 }
    translation: { axis: "y", sign: 1, px_per_m: 703.2222, second_best_ratio: 0.178 }
  clockwise:
    rotation: { axis: "theta_z", sign: -1, deg_per_deg: 1.0505, second_best_ratio: 0.155 }
  closer:
    translation: { axis: "z", sign: 1, square_px_per_m: 41.3333, second_best_ratio: 0.376 }
