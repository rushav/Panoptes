  z: { dx_px: -8.8400, dy_px: 2.9500, droll_deg: -0.0383, dsquare_px: 1.2477 }
# Centroid distance between before and after each return to the start, px.
return_error_px: { theta_x: 0.518, theta_y: 0.090, theta_z: 0.090, x: 0.203, y: 0.073, z: 0.057 }

# Which tool axis to use for each image direction. sign: the tool motion's
# sign that moves the board right / down / clockwise / closer; the opposite
# direction is the opposite sign. second_best_ratio: the next strongest axis
# as a fraction of this one (over 0.5: the axes are coupled).
mapping:
  right:
    rotation: { axis: "theta_y", sign: 1, px_per_deg: 11.2400, second_best_ratio: 0.103 }
    translation: { axis: "x", sign: 1, px_per_m: 806.0000, second_best_ratio: 0.366 }
  down:
    rotation: { axis: "theta_x", sign: -1, px_per_deg: 12.9833, second_best_ratio: 0.117 }
    translation: { axis: "y", sign: 1, px_per_m: 704.8889, second_best_ratio: 0.140 }
  clockwise:
    rotation: { axis: "theta_z", sign: -1, deg_per_deg: 1.0193, second_best_ratio: 0.197 }
  closer:
    translation: { axis: "z", sign: 1, square_px_per_m: 41.5889, second_best_ratio: 0.322 }
