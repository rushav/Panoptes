%YAML:1.0
---
# Written by python/arm_capture.py probe (RUNBOOK §13). Rerun the probe
# rather than editing: it is valid only for this camera, this camera
# position, this grip of the board, and the arm pose it started from.
#
# Tool frame. Rotations are about the tool axes through the TCP, angles in
# deg; translations along the tool axes, in m. Kortex Euler angles are
# x-y-z extrinsic: R = Rz(theta_z) Ry(theta_y) Rx(theta_x) (Gen3 user guide).
# Image: x right, y down, px; roll positive = clockwise on screen; square_px
# = apparent size of one board square, larger = closer.
created_utc: "2026-11-10T22:48:31Z"
camera_serial: 33663
start_pose: [ 0.60792, 0.05609, 0.47326, 90.75602, -3.09840, 87.12020 ]   # x y z m, theta_x/y/z deg
probe_angle_deg: 2.0
probe_step_m: 0.03
start_board: { centroid_px: [ 562.70, 445.54 ], square_px: 43.998, roll_deg: -0.560 }

# Image change per unit tool motion: rotation rows per deg, translation rows per m.
sensitivity:
  theta_x: { dx_px: 0.1233, dy_px: -12.9833, droll_deg: -0.0298, dsquare_px: 0.0617 }
  theta_y: { dx_px: 11.2400, dy_px: -0.1133, droll_deg: 0.2008, dsquare_px: -0.0678 }
  theta_z: { dx_px: -1.1550, dy_px: 1.5150, droll_deg: -1.0193, dsquare_px: -0.0138 }
  x: { dx_px: 806.0000, dy_px: 3.5556, droll_deg: 2.9444, dsquare_px: 0.9556 }
  y: { dx_px: 61.7778, dy_px: 704.8889, droll_deg: 14.4556, dsquare_px: -13.3889 }
  z: { dx_px: -294.6667, dy_px: 98.3333, droll_deg: -1.2778, dsquare_px: 41.5889 }
# Measured change for the actual probe size.
raw_effects:
  theta_x: { dx_px: 0.2467, dy_px: -25.9667, droll_deg: -0.0597, dsquare_px: 0.1233 }
  theta_y: { dx_px: 22.4800, dy_px: -0.2267, droll_deg: 0.4017, dsquare_px: -0.1357 }
  theta_z: { dx_px: -2.3100, dy_px: 3.0300, droll_deg: -2.0387, dsquare_px: -0.0277 }
  x: { dx_px: 24.1800, dy_px: 0.1067, droll_deg: 0.0883, dsquare_px: 0.0287 }
