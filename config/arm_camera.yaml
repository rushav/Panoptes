  z: { dx_px: -0.5267, dy_px: 4.2433, droll_deg: 0.0130, dsquare_px: 0.8913 }
# Centroid distance between before and after each return to the start, px.
return_error_px: { theta_x: 0.246, theta_y: 0.050, theta_z: 0.057, x: 0.083, y: 0.126, z: 0.059 }

# Which tool axis to use for each image direction. sign: the tool motion's
# sign that moves the board right / down / clockwise / closer; the opposite
# direction is the opposite sign. second_best_ratio: the next strongest axis
# as a fraction of this one (over 0.5: the axes are coupled).
mapping:
  right:
    rotation: { axis: "theta_y", sign: 1, px_per_deg: 10.3283, second_best_ratio: 0.061 }
    translation: { axis: "x", sign: 1, px_per_m: 867.0000, second_best_ratio: 0.020 }
  down:
    rotation: { axis: "theta_x", sign: -1, px_per_deg: 13.3383, second_best_ratio: 0.029 }
    translation: { axis: "y", sign: 1, px_per_m: 576.0000, second_best_ratio: 0.246 }
  clockwise:
    rotation: { axis: "theta_z", sign: -1, deg_per_deg: 1.0312, second_best_ratio: 0.145 }
  closer:
    translation: { axis: "z", sign: 1, square_px_per_m: 29.7111, second_best_ratio: 0.168 }
